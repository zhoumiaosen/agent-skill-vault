name: Validate vault
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-validation.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/validate_vault.py
      - run: python tools/check_evaluations.py check
      - run: python tools/check_evaluations.py report evaluations/not-run.json
